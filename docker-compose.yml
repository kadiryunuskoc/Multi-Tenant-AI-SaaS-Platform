version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_platform_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./storage/ai_platform.db
      - SECRET_KEY=multi-tenant-ai-saas-platform-secret-key-change-in-production-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - UPLOAD_DIR=./storage/uploads
      - MODEL_DIR=./storage/models
      - APP_NAME=Multi-Tenant AI SaaS Platform
      - APP_VERSION=1.0.0
      - DEBUG=True
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  storage:
    driver: local
